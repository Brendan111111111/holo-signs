plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    mavenCentral()
    maven {
        name = 'ComputerCraft'
        url = 'https://maven.squiddev.cc'
        content {
            includeGroup('cc.tweaked')
        }
    }
}

base {
    archivesName = mod_id
}

// Test-only OpenComputers 26.1 build. It is used to compile the optional integration and is
// staged into run/mods for the headless Screen Linker game test; it is never packaged.
def ocTestJar = file('libs/opencomputers-neoforge-1.11.0.jar')

// Mojang ships Java 25 to end users in 26.1.2, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // Write a JUnit-like report so CI can list every test, including passing ones.
            programArgument '--report'
            programArgument file('run/gametest-results.xml').getAbsolutePath()
        }

        // Runs the packaged jar, and nothing else, in a throwaway game directory. The dev class
        // folders are dropped from fml.modFolders, so the mod can only come from the jar staged in
        // build/release-smoke/mods; the game tests prove it started and works from that artifact.
        releaseSmoke {
            type = "gameTestServer"
            gameDirectory = file('build/release-smoke')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'fml.modFolders', ''
            programArgument '--report'
            programArgument file('build/release-smoke/gametest-results.xml').getAbsolutePath()
        }

        data {
            clientData()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-logging-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Gradle otherwise forces its own platform encoding (windows-1252 here) onto the game JVM, and it
// appends that after the run's VM arguments. A normal launcher leaves Java's UTF-8 default in place,
// and OpenComputers decodes Lua strings with the default charset, so the dev runs need UTF-8 too or
// standard OpenOS box borders arrive as mojibake in the dev client only.
tasks.withType(JavaExec).configureEach {
    defaultCharacterEncoding = 'UTF-8'
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
    // External compile dependencies for the OpenComputers API sources. Keeping this separate from
    // sourceSets.main.compileClasspath lets the main classpath include the compiled API output
    // without making the API compile depend on its own classes.
    ocApiCompile
}
configurations.ocApiCompile.extendsFrom(configurations.compileClasspath)

dependencies {
    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // Unit tests for pure Java parts of the projector terminal and update path.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'

    // Compile against CC:Tweaked's public API without bundling it into the core mod.
    compileOnly "cc.tweaked:cc-tweaked-${minecraft_version}-forge-api:${cct_version}"

    // CC:Tweaked is present only when its mod is installed, never a required runtime dependency.
    // The integration is isolated behind CCIntegration so the core mod loads without the CC API.

    // Optional OpenComputers: Modernized 26.1 integration. It is compiled when the 26.1 source
    // archive is present, or against the test jar kept in libs/ so CI can build and run the
    // Screen Linker game test without downloading an unpublished 26.1 build. Pass
    // -Poc_compile_integrations=true to require the integration and fail when neither source is
    // available. The integration classes are part of the mod jar; the OpenComputers jar itself is
    // never packaged.
    def ocArchiveRoot = fileTree('.opencomputers-api').matching { include '*/settings.gradle' }.files
            .find { it.parentFile.name.startsWith('Mantoku1-OpenComputers-NeoForge-26.1-') }?.parentFile
    def ocIntegrations = project.findProperty('oc_compile_integrations') == 'true' || ocArchiveRoot != null || ocTestJar.exists()
    if (ocIntegrations) {
        def ocRoot = ocArchiveRoot
        if (ocRoot == null && !ocTestJar.exists()) {
            throw new GradleException('OpenComputers integration requires its 26.1 source archive extracted under .opencomputers-api/ or the test jar at libs/opencomputers-neoforge-1.11.0.jar.')
        }
        // Compile the integration into the normal mod output. A separate source set would only
        // reach the packaged jar, while Gradle's client/server runs load build/classes/java/main,
        // which would leave the Screen Linker and the TextBuffer implementation unavailable.
        sourceSets.main.java.srcDir('src/optional/opencomputers/java')
        if (ocRoot != null) {
            sourceSets {
                // Compile the OC:M 26.1 API modules from source; they are never packaged into the mod jar.
                ocApi {
                    java.srcDir(new File(ocRoot, 'api/src/main/java'))
                    java.srcDir(new File(ocRoot, 'neoforge-api/src/main/java'))
                    java.srcDir('src/optional/opencomputers/api-stubs')
                }
            }
            sourceSets.ocApi.compileClasspath = configurations.ocApiCompile
            sourceSets.main.compileClasspath += sourceSets.ocApi.output
            tasks.named('compileJava') {
                dependsOn tasks.named('compileOcApiJava')
            }
        } else {
            compileOnly files(ocTestJar)
        }
    }

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// The release smoke test gets a clean game directory: Sync empties build/release-smoke of the
// previous world, logs and reports, then stages only the packaged jar in its mods folder. It must
// run every time, or a second run would reuse the world it is supposed to create from scratch.
def stageReleaseSmokeJar = tasks.register('stageReleaseSmokeJar', Sync) {
    dependsOn tasks.named('jar')
    into layout.buildDirectory.dir('release-smoke')
    from(tasks.named('jar')) {
        into 'mods'
    }
    doNotTrackState('The smoke test needs a fresh game directory on every run.')
}
tasks.matching { it.name == 'runReleaseSmoke' }.configureEach {
    dependsOn stageReleaseSmokeJar
    def packagedJarName = tasks.named('jar').flatMap { it.archiveFileName }
    def smokeDebugLog = layout.buildDirectory.file('release-smoke/logs/debug.log')
    def smokeConsoleLog = layout.buildDirectory.file('release-smoke/logs/latest.log')
    def devClasses = layout.buildDirectory.dir('classes/java/main')
    // The run already fails when a game test fails. This checks the other half: that the tests ran
    // against the jar in the game directory, not the dev class folders during a debug run.
    doLast {
        def jarName = packagedJarName.get()
        def debugLog = smokeDebugLog.get().asFile.text
        def consoleLog = smokeConsoleLog.get().asFile.text
        def problems = []
        if (!debugLog.contains("Found valid mod file ${jarName}")) {
            problems.add("FML never discovered ${jarName} in build/release-smoke/mods.")
        }
        if (!consoleLog.contains("jar(mods/${jarName})")) {
            problems.add("The mod list does not show ${jarName} loaded from mods/.")
        }
        if (debugLog.contains(devClasses.get().asFile.absolutePath)) {
            problems.add('The smoke run loaded the dev class folders instead of the packaged jar.')
        }
        if (!problems.isEmpty()) {
            throw new GradleException('Release smoke test did not load the packaged jar:\n - ' + problems.join('\n - '))
        }
    }
}

// The game test server loads mods from run/mods. Stage the OpenComputers test jar there so a
// clean CI checkout can run the Screen Linker test, and keep local runs using the same build.
def stageOpenComputersTestMod = tasks.register('stageOpenComputersTestMod', Copy) {
    if (ocTestJar.exists()) {
        from ocTestJar
        into layout.projectDirectory.dir('run/mods')
    }
}
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    dependsOn stageOpenComputersTestMod
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

tasks.named('test') {
    useJUnitPlatform()
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
