# Gradle defaults, matching the official Minecraft 26.1.2 ModDevGradle MDK.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Minecraft and NeoForge versions must match.
minecraft_version=26.1.2
minecraft_version_range=[26.1.2]
neo_version=26.1.2.122

# Mod metadata.
mod_id=holosigns
mod_name=Holo Signs
mod_license=MIT
mod_version=0.1.0
mod_group_id=com.brendan.holograms

# Optional ComputerCraft API.
cct_version=1.120.0

# Optional OpenComputers: Modernized 26.1 integration. Extract Mantoku1/OpenComputers-NeoForge-26.1 into
# .opencomputers-api/ and build with -Poc_compile_integrations=true; its API modules are compiled from source.
oc_compile_integrations=false
