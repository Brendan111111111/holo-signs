license="${mod_license}"
issueTrackerURL="https://github.com/Brendan111111111/holo-signs/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/Brendan111111111/holo-signs"
authors="Brendan111111111"
description='''
Place standalone holographic projectors, edit up to eight lines of floating text, and optionally control displays with CC:Tweaked or OpenComputers: Modernized.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="computercraft"
type="optional"
versionRange="[1.120.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="opencomputers"
type="optional"
versionRange="[1.11.0,)"
ordering="AFTER"
side="BOTH"
