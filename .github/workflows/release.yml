name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual runs exercise the build and the release jar check without publishing.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # ubuntu-latest starts migrating to Ubuntu 26 in October 2026; pin the image CI is
    # tested against so a silent migration cannot change the build toolchain.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      # Pinned to v5: gradle/actions v6 ships its caching component under proprietary
      # terms, and setup-gradle enables caching by default. v5 is Node 24 and still MIT.
      - name: Setup Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.2.1'

      # Fail loudly if the test-only OpenComputers jar was not committed; otherwise the
      # integration would quietly compile out and the link test would be skipped.
      - name: Verify OpenComputers test jar
        run: |
          test -f libs/opencomputers-neoforge-1.11.0.jar
          echo "862e762c41f240df512e92dde33127d44278725d57f52b40ed2ebe83d4eaf1f9  libs/opencomputers-neoforge-1.11.0.jar" | sha256sum -c -

      - name: Build and unit tests
        run: gradle build --console=plain

      # The 26.1 OpenComputers build is not published; the test jar is kept in libs/.
      - name: Install OpenComputers test mod
        run: gradle stageOpenComputersTestMod --console=plain

      - name: Headless game tests
        run: gradle runGameTestServer --console=plain

      # A tag run checks the jar named by the tag; a manual run checks the jar named by
      # mod_version, so the release path can be exercised without pushing a tag.
      - name: Verify release jar
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')"
            echo "Manual run: verifying holosigns-$version.jar; no release will be published."
          fi
          jar="build/libs/holosigns-${version}.jar"
          if [ ! -f "$jar" ]; then
            echo "Expected $jar; does the version match mod_version in gradle.properties?" >&2
            exit 1
          fi
          echo "Packaged $jar"

      - name: Create or update GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          jar="build/libs/holosigns-${tag#v}.jar"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$jar" --clobber
          else
            gh release create "$tag" "$jar" --title "$tag" --generate-notes
          fi
