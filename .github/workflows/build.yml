name: Build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      # Fail loudly if the test-only OpenComputers jar was not committed; otherwise the
      # integration would quietly compile out and the link test would be skipped.
      - name: Verify OpenComputers test jar
        run: |
          test -f libs/opencomputers-neoforge-1.11.0.jar
          echo "862e762c41f240df512e92dde33127d44278725d57f52b40ed2ebe83d4eaf1f9  libs/opencomputers-neoforge-1.11.0.jar" | sha256sum -c -

      # `build` compiles and packages the mod and runs the JUnit tests through `check`.
      - name: Build and unit tests
        run: gradle build --console=plain

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: holosigns-jar
          path: build/libs/holosigns-*.jar
          if-no-files-found: error

      # The 26.1 OpenComputers build is not published; the test jar is kept in libs/.
      - name: Install OpenComputers test mod
        run: gradle stageOpenComputersTestMod --console=plain

      # Starts a real headless GameTestServer, runs the projector game tests, then exits.
      # The run config writes run/gametest-results.xml for the next step to print.
      - name: Headless game tests
        run: |
          rm -f run/gametest-results.xml
          gradle runGameTestServer --console=plain

      # The XML report lists every test, not only failures, so the run log shows coverage.
      - name: Print game test results
        if: always()
        run: |
          if [ ! -f run/gametest-results.xml ]; then
            echo "No game test report was written."
            exit 0
          fi
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          for case in ET.parse("run/gametest-results.xml").getroot().iter("testcase"):
              failure = case.find("failure")
              skipped = case.find("skipped")
              status = "FAILED" if failure is not None else ("SKIPPED" if skipped is not None else "PASSED")
              print(f"{status} {case.get('name')}")
          PY

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            run/logs
            run/crash-reports
          if-no-files-found: ignore
