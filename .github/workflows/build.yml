name: Build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    # Pinned rather than ubuntu-latest so the image only changes when we choose. Ubuntu 26
    # is where GitHub is migrating the floating label, so test it here deliberately.
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      # Pinned to v5: gradle/actions v6 ships its caching component under proprietary
      # terms, and setup-gradle enables caching by default. v5 is Node 24 and still MIT.
      - name: Setup Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.2.1'

      # Fail loudly if the test-only OpenComputers jar was not committed; otherwise the
      # integration would quietly compile out and the link test would be skipped.
      - name: Verify OpenComputers test jar
        run: |
          test -f libs/opencomputers-neoforge-1.11.0.jar
          echo "862e762c41f240df512e92dde33127d44278725d57f52b40ed2ebe83d4eaf1f9  libs/opencomputers-neoforge-1.11.0.jar" | sha256sum -c -

      # `build` compiles and packages the mod and runs the JUnit tests through `check`.
      - name: Build and unit tests
        run: gradle build --console=plain

      - name: Upload mod jar
        uses: actions/upload-artifact@v7
        with:
          name: holosigns-jar
          path: build/libs/holosigns-*.jar
          if-no-files-found: error

      # The 26.1 OpenComputers build is not published; the test jar is kept in libs/.
      - name: Install OpenComputers test mod
        run: gradle stageOpenComputersTestMod --console=plain

      # Starts a real headless GameTestServer, runs the projector game tests, then exits.
      # The run config writes run/gametest-results.xml for the next step to print.
      - name: Headless game tests
        run: |
          rm -f run/gametest-results.xml
          gradle runGameTestServer --console=plain

      # The XML report lists every test, not only failures, so both the run log and the
      # job summary show coverage.
      - name: Print game test results
        if: always()
        run: |
          if [ -z "${GITHUB_STEP_SUMMARY:-}" ]; then
            echo "::error::GITHUB_STEP_SUMMARY is not set, so the game test results cannot be published."
            exit 1
          fi
          if [ ! -f run/gametest-results.xml ]; then
            echo "::error::No game test report was written to run/gametest-results.xml."
            {
              echo "### Game test results"
              echo
              echo "No game test report was written."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          python3 - <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET

          summary_path = os.environ["GITHUB_STEP_SUMMARY"]
          before = os.path.getsize(summary_path) if os.path.exists(summary_path) else 0

          rows = []
          counts = {"PASSED": 0, "FAILED": 0, "SKIPPED": 0}
          for case in ET.parse("run/gametest-results.xml").getroot().iter("testcase"):
              failure = case.find("failure")
              skipped = case.find("skipped")
              status = "FAILED" if failure is not None else ("SKIPPED" if skipped is not None else "PASSED")
              counts[status] += 1
              name = case.get("name", "unknown")
              print(f"{status} {name}")
              rows.append(f"| {status} | `{name}` |")

          if not rows:
              print("::error::The game test report contains no test cases.", file=sys.stderr)
              raise SystemExit(1)

          summary = "\n".join([
              "### Game test results",
              "",
              "| Status | Test |",
              "| --- | --- |",
              *rows,
              "",
              f"{counts['PASSED']} passed, {counts['FAILED']} failed, {counts['SKIPPED']} skipped",
              "",
          ])
          with open(summary_path, "a", encoding="utf-8") as summary_file:
              summary_file.write(summary)

          after = os.path.getsize(summary_path) if os.path.exists(summary_path) else 0
          if after <= before:
              print("::error::The job summary file is empty or did not receive the game test results.", file=sys.stderr)
              raise SystemExit(1)
          print(f"Wrote {len(rows)} test results to the job summary ({after - before} bytes).")
          PY

      # Launches build/libs/holosigns-<version>.jar on its own in build/release-smoke and runs the
      # mod's game tests from it, so packaging breakage is caught on every push.
      - name: Packaged jar smoke test
        run: gradle runReleaseSmoke --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            run/logs
            run/crash-reports
            build/release-smoke/logs
          if-no-files-found: ignore
